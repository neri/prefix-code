<!DOCTYPE html>
<html>

<head>
    <title>*</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#1976D2" />
    <script type="module" src="/src/main.ts"></script>
</head>

<header>
    <a id="menuButton"><span class="ic_menu_white">&nbsp;</span></a>
    <span class="app_name">&nbsp;</span>
</header>

<nav id="dialogMainMenu" class="dialogSeed">
    <ul>
        <li><a id="aboutMenuItem" class="button">About</a></li>
    </ul>
</nav>

<div id="main" class="main">
    <textarea id="inputText" rows="5" placeholder="Enter the text to be encoded here.">abracadabra</textarea><br>
    <input id="execButton" type="button" value="↓ Encode ↓" class="buttonActive" />
    <label>
        Max Bit Length:
        <select id="maxBitSize">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15" selected>15</option>
        </select>
    </label>
    <br>
    <!-- <textarea id="encodedText" readonly rows="5" placeholder="Encoded"></textarea><br> -->
    <div id="resultArea"><span title="sushi"></span></div>
</div>

<hr>

<div id="dialogAlert" class="dialogSeed">
    <p id="alertMessage"></p>
</div>

<div id="dialogAbout" class="dialogSeed">
    <h1><span class="app_name">&nbsp;</span></h1>
    <p class="center"><span class="app_version"></span></p>
    <p class="center"><span class="copyright"></span></p>

    <hr>
    <p>
        You can experiment with compressing the input text with <a
            href="https://en.wikipedia.org/wiki/Canonical_Huffman_code" target="_blank">Canonical Huffman code</a>.
    </p>
    <ul>
        <li>The data you enter will not be transmitted over the network.</li>
        <li>Since this tool is not intended for practical use, the output format may change without notice.</li>
    </ul>

    <hr>
    <span class="repository_button"></span>
</div>

</html>
